name: One-shot production dependency refresh

on:
  push:
    branches:
      - ci/production-dependency-audit-20260918
    paths:
      - '.github/workflows/refresh-production-deps.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'THE-BU1LD/ResearchPilot' && github.ref == 'refs/heads/ci/production-dependency-audit-20260918'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply compatible production advisory fixes
        run: npm audit fix --omit=dev

      - name: Require production audit clean at high severity
        run: npm audit --omit=dev --audit-level=high

      - name: Re-run application gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/lint-baseline.mjs
          npx tsc -b --pretty false
          npm run build

      - name: Commit reviewed package graph changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo 'npm audit fix produced no package graph change.' >&2
            exit 1
          fi
          git diff -- package.json package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'fix(deps): clear high-severity production advisories [audit-fix-generated]'
          git push origin HEAD:${GITHUB_REF_NAME}
